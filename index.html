<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Solenz AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div id="appLayout" class="app-layout">
        <!-- Sidebar / Drawer -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <button id="menuCloseBtn" class="icon-btn mobile-only">
                    <span class="material-symbols-rounded">menu_open</span>
                </button>
                <button id="newChatBtn" class="new-chat-btn">
                    <span class="material-symbols-rounded">add</span>
                    <span class="btn-text">Yeni Sohbet</span>
                </button>
            </div>
            
            <div class="sidebar-content">
                <div class="chat-history-section">
                    <h3 class="section-title">Son</h3>
                    <div id="chatHistoryList" class="chat-list">
                        <!-- History items will be injected here -->
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="footer-btn">
                    <span class="material-symbols-rounded">help</span>
                    <span class="btn-text">Yardım</span>
                </button>
                <button class="footer-btn">
                    <span class="material-symbols-rounded">history</span>
                    <span class="btn-text">Etkinlik</span>
                </button>
                <button class="footer-btn">
                    <span class="material-symbols-rounded">settings</span>
                    <span class="btn-text">Ayarlar</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-container">
            <!-- Top Navigation Bar -->
            <header class="top-nav">
                <div class="left-actions">
                    <button id="menuOpenBtn" class="icon-btn">
                        <span class="material-symbols-rounded">menu</span>
                    </button>
                    <div class="model-selector-wrapper">
                        <button id="modelSelectorBtn" class="model-btn">
                            <span class="model-name">Solenz AI</span>
                            <span class="material-symbols-rounded">expand_more</span>
                        </button>
                    </div>
                </div>
                
                <div class="right-actions">
                    <button id="themeToggleBtn" class="icon-btn">
                        <span class="material-symbols-rounded">dark_mode</span>
                    </button>
                    <div class="user-profile">
                        <button id="userProfileBtn" class="profile-btn">
                            <img src="https://ui-avatars.com/api/?name=User&background=random" alt="User" class="avatar">
                        </button>
                    </div>
                </div>
            </header>

            <!-- Chat Content Area -->
            <div id="chatContent" class="chat-content">
                <div class="welcome-container">
                    <h1 class="welcome-text">Merhaba, size nasıl yardımcı olabilirim?</h1>
                    <div class="suggestions-grid">
                        <div class="suggestion-card">
                            <span class="material-symbols-rounded">edit</span>
                            <p>Bana bir hikaye yaz...</p>
                        </div>
                        <div class="suggestion-card">
                            <span class="material-symbols-rounded">code</span>
                            <p>Python kodu yazmama yardım et...</p>
                        </div>
                        <div class="suggestion-card">
                            <span class="material-symbols-rounded">lightbulb</span>
                            <p>Bir akşam yemeği menüsü öner...</p>
                        </div>
                    </div>
                </div>
                <div id="messagesContainer" class="messages-container hidden">
                    <!-- Messages will be injected here -->
                </div>
            </div>

            <!-- Bottom Input Area -->
            <footer class="input-area">
                <div class="input-wrapper-neon">
                    <div class="input-container">
                        <button class="icon-btn attach-btn">
                            <span class="material-symbols-rounded">add</span>
                        </button>
                        <textarea id="chatInput" placeholder="Buraya bir şeyler yazın..." rows="1"></textarea>
                        <div class="input-actions">
                            <button id="imageBtn" class="icon-btn">
                                <span class="material-symbols-rounded">image</span>
                            </button>
                            <button id="micBtn" class="icon-btn">
                                <span class="material-symbols-rounded">mic</span>
                            </button>
                            <button id="sendBtn" class="icon-btn send-btn" disabled>
                                <span class="material-symbols-rounded">send</span>
                            </button>
                        </div>
                    </div>
                </div>
                <p class="disclaimer">Solenz AI hata yapabilir. Önemli bilgileri kontrol etmeyi unutmayın.</p>
            </footer>
        </main>

        <!-- Overlay for Mobile Sidebar -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
